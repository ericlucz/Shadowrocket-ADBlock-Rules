<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外贸客户管理 · Foreign Trade CRM</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --border:#e3e6ea; --border-2:#eef0f3;
  --text:#1b1f24; --muted:#6b7280; --faint:#9aa1ab;
  --accent:#2f5cff; --accent-soft:#e8edff; --accent-text:#1c3fd6;
  --ok:#0f9d58; --ok-soft:#e3f5ea; --warn:#c47f00; --warn-soft:#fdf3dd;
  --danger:#d33a3a; --danger-soft:#fdeaea; --info:#0a7ea4; --info-soft:#e2f3f8;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --radius:10px;
}
html[data-theme="dark"]{
  --bg:#12141a; --panel:#191c23; --panel-2:#1e222a; --border:#2b303a; --border-2:#242932;
  --text:#e7eaf0; --muted:#9aa3b2; --faint:#727c8c;
  --accent:#6b8cff; --accent-soft:#212a48; --accent-text:#a8bcff;
  --ok:#3ecf8e; --ok-soft:#16301f; --warn:#e0a33a; --warn-soft:#33260f;
  --danger:#f07171; --danger-soft:#361a1a; --info:#4ec3e0; --info-soft:#0f2c34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:650;letter-spacing:.2px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--faint);letter-spacing:.3px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--muted);text-align:left;width:100%;font-size:13.5px}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-item .ico{width:18px;text-align:center;flex:none}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:20px;font-size:11px;padding:1px 6px;font-weight:600}
.sidebar-foot{margin-top:auto;display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--border-2)}
.icon-btn{border:1px solid var(--border);background:var(--panel-2);border-radius:8px;padding:6px 9px;color:var(--muted);font-size:12px;flex:1}
.icon-btn:hover{color:var(--text);border-color:var(--accent)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:20}
.topbar h1{margin:0;font-size:16px;font-weight:650;white-space:nowrap}
.search{flex:1;max-width:380px;position:relative}
.search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2)}
.search span{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:12px}
.search input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.clock{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.content{padding:20px;flex:1;min-width:0}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 13px;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--border)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- cards / grid ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-size:26px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.card .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border-2);font-weight:600;font-size:13.5px}
.panel-h .count{color:var(--faint);font-weight:400;font-size:12px}
.panel-b{padding:14px 16px}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px;align-items:start}
@media(max-width:1000px){.two-col{grid-template-columns:1fr}}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:500;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel-2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
td{padding:10px 12px;border-bottom:1px solid var(--border-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
.co{font-weight:600}
.sub-line{font-size:11.5px;color:var(--faint);margin-top:1px}
.empty{padding:44px 20px;text-align:center;color:var(--faint)}
.empty .big{font-size:30px;margin-bottom:8px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.lead{background:var(--panel-2);color:var(--muted);border-color:var(--border)}
.chip.inquiry{background:var(--info-soft);color:var(--info)}
.chip.quoted{background:var(--accent-soft);color:var(--accent-text)}
.chip.sample{background:var(--warn-soft);color:var(--warn)}
.chip.negotiating{background:var(--warn-soft);color:var(--warn)}
.chip.won{background:var(--ok-soft);color:var(--ok)}
.chip.dormant{background:var(--panel-2);color:var(--faint);border-color:var(--border)}
.chip.lost{background:var(--danger-soft);color:var(--danger)}
.grade{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:700}
.grade.A{background:var(--ok-soft);color:var(--ok)}
.grade.B{background:var(--accent-soft);color:var(--accent-text)}
.grade.C{background:var(--panel-2);color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--panel-2);border:1px solid var(--border);font-size:11px;color:var(--muted);margin:0 4px 4px 0}
.due{font-variant-numeric:tabular-nums}
.due.over{color:var(--danger);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.flag{font-size:15px;margin-right:5px;line-height:1}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters select,.filters input{padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);font-size:12.5px}
.filters .spacer{flex:1}

/* ---------- bars ---------- */
.bar-row{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;margin-bottom:9px;font-size:12.5px}
.bar{height:7px;border-radius:20px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:20px;background:var(--accent)}
.bar-row .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- list items ---------- */
.li{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border-2);cursor:pointer;align-items:flex-start}
.li:last-child{border-bottom:0}
.li:hover{background:var(--panel-2)}
.li .body{min-width:0;flex:1}
.li .t{font-weight:600;font-size:13px}
.li .d{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{font-size:11.5px;color:var(--faint);white-space:nowrap;text-align:right}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,15,20,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,100vw);background:var(--panel);border-left:1px solid var(--border);z-index:51;transform:translateX(100%);transition:transform .2s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.drawer-h h2{margin:0;font-size:17px}
.drawer-h .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.drawer-b{overflow:auto;padding:16px 18px;flex:1}
.drawer-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:var(--panel-2)}
.drawer-f .spacer{flex:1}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--panel)}
.tab{border:0;background:none;padding:9px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:600}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.hint{font-size:11px;color:var(--faint)}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.tl-head{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tl-body{margin-top:3px;white-space:pre-wrap;word-break:break-word}
.tl-del{border:0;background:none;color:var(--faint);font-size:11px;padding:0 2px}
.tl-del:hover{color:var(--danger)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--text);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;word-break:break-word}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.settings-sec{margin-bottom:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;border-right:0;border-top:1px solid var(--border);padding:6px;z-index:40;overflow-x:auto}
  .brand,.sidebar-foot{display:none}
  .nav-item{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
  .content{padding:14px 14px 70px}
  .form{grid-template-columns:1fr}
}
</style>
</head>

/* =========================================================================
   3. 状态与存储 / State & storage
   ========================================================================= */
const STORE_KEY = "ftcrm.v1";

const state = {
  customers: [],
  settings: { lang: "zh", theme: "auto" },
  view: "dashboard",
  search: "",
  filters: { country:"", status:"", grade:"", source:"", due:"" },
  sort: "next",
  openId: null,
  drawerTab: "info"
};

function load(){
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e){ /* storage blocked */ }
  if(!raw) return;
  try{
    const data = JSON.parse(raw);
    if(Array.isArray(data.customers)) state.customers = data.customers.map(normalizeCustomer);
    if(data.settings) Object.assign(state.settings, data.settings);
  }catch(e){ console.warn("load failed", e); }
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      version:1, savedAt:new Date().toISOString(),
      customers:state.customers, settings:state.settings
    }));
  }catch(e){ toast("⚠ " + e.message); }
}

function normalizeCustomer(c){
  return {
    id: c.id || uid(),
    company: c.company || "",
    contact: c.contact || "",
    jobTitle: c.jobTitle || "",
    email: c.email || "",
    phone: c.phone || "",
    whatsapp: c.whatsapp || "",
    wechat: c.wechat || "",
    website: c.website || "",
    country: COUNTRY_MAP[c.country] ? c.country : (c.country ? "OT" : ""),
    address: c.address || "",
    source: c.source || "",
    products: c.products || "",
    value: Number(c.value) || 0,
    currency: c.currency || "USD",
    grade: ["A","B","C"].includes(c.grade) ? c.grade : "B",
    status: STATUSES.some(s => s[0] === c.status) ? c.status : "lead",
    tags: Array.isArray(c.tags) ? c.tags : (c.tags ? String(c.tags).split(/[,，;；]/).map(s=>s.trim()).filter(Boolean) : []),
    remark: c.remark || "",
    nextFollowUp: c.nextFollowUp || "",
    createdAt: c.createdAt || new Date().toISOString(),
    updatedAt: c.updatedAt || c.createdAt || new Date().toISOString(),
    followUps: (Array.isArray(c.followUps) ? c.followUps : []).map(f => ({
      id: f.id || uid(), date: f.date || todayStr(),
      channel: f.channel || "email", note: f.note || ""
    })).sort((a,b) => b.date.localeCompare(a.date))
  };
}

/* =========================================================================
   4. 工具函数 / Helpers
   ========================================================================= */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function t(key, vars){
  let s = (I18N[state.settings.lang] && I18N[state.settings.lang][key]) || I18N.zh[key] || key;
  if(vars) for(const k in vars) s = s.replace("%" + k, vars[k]);
  return s;
}
const isZh = () => state.settings.lang === "zh";
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function label(list, code){
  const row = list.find(r => r[0] === code);
  return row ? (isZh() ? row[1] : row[2]) : "";
}
const statusLabel  = c => label(STATUSES, c);
const sourceLabel  = c => label(SOURCES, c);
const channelLabel = c => label(CHANNELS, c);
function countryName(code){
  const c = COUNTRY_MAP[code];
  return c ? (isZh() ? c[1] : c[2]) : "";
}
function flag(code){
  if(!code || code === "OT" || !/^[A-Z]{2}$/.test(code)) return "🏳";
  return String.fromCodePoint(...[...code].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
}
function localTime(code){
  const c = COUNTRY_MAP[code];
  if(!c || !c[4]) return "";
  try{
    return new Intl.DateTimeFormat(isZh() ? "zh-CN" : "en-GB",
      { timeZone:c[4], hour:"2-digit", minute:"2-digit", hour12:false, weekday:"short" }).format(new Date());
  }catch(e){ return ""; }
}
function todayStr(d){
  const x = d ? new Date(d) : new Date();
  return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function daysBetween(dateStr){          // 正数 = 还有几天, 负数 = 逾期几天
  if(!dateStr) return null;
  const a = new Date(todayStr() + "T00:00:00");
  const b = new Date(dateStr + "T00:00:00");
  if(isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}
function dueText(dateStr){
  const d = daysBetween(dateStr);
  if(d === null) return { text:"—", cls:"" };
  if(d === 0)  return { text:t("today"), cls:"today" };
  if(d === 1)  return { text:t("tomorrow"), cls:"today" };
  if(d < 0)    return { text:t("daysOver",{n:-d}), cls:"over" };
  return { text:t("daysLeft",{n:d}), cls:"" };
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? String(iso).slice(0,10) : todayStr(d);
}
function fmtMoney(v, cur){
  if(!v) return "—";
  try{ return new Intl.NumberFormat(isZh()?"zh-CN":"en-US",{style:"currency",currency:cur||"USD",maximumFractionDigits:0}).format(v); }
  catch(e){ return (cur||"") + " " + v; }
}
const lastContact = c => (c.followUps && c.followUps.length) ? c.followUps[0].date : "";
const isOpen = c => !["won","lost","dormant"].includes(c.status);

function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast._tid);
  toast._tid = setTimeout(() => el.classList.remove("on"), 2200);
}
function download(name, content, mime){
  const blob = new Blob([content], { type: mime || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function optionsHtml(list, selected, placeholder){
  const head = placeholder != null ? `<option value="">${esc(placeholder)}</option>` : "";
  return head + list.map(r =>
    `<option value="${esc(r[0])}"${r[0] === selected ? " selected" : ""}>${esc(isZh() ? r[1] : r[2])}</option>`).join("");
}
function countryOptions(selected){
  const sorted = COUNTRIES.slice().sort((a,b) =>
    a[0] === "OT" ? 1 : b[0] === "OT" ? -1 : (isZh() ? a[1].localeCompare(b[1],"zh") : a[2].localeCompare(b[2])));
  return `<option value="">—</option>` + sorted.map(c =>
    `<option value="${c[0]}"${c[0] === selected ? " selected" : ""}>${flag(c[0])} ${esc(isZh()?c[1]:c[2])} ${c[3]}</option>`).join("");
}

/* =========================================================================
   5. 查询与排序 / Query
   ========================================================================= */
function matchesSearch(c, q){
  if(!q) return true;
  const hay = [c.company,c.contact,c.email,c.phone,c.whatsapp,c.wechat,c.products,c.remark,
               c.website,c.address,countryName(c.country),(c.tags||[]).join(" ")].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function passesDue(c, mode){
  const d = daysBetween(c.nextFollowUp);
  switch(mode){
    case "overdue": return d !== null && d < 0;
    case "today":   return d === 0;
    case "week":    return d !== null && d >= 0 && d <= 7;
    case "none":    return d === null;
    default:        return true;
  }
}
function visibleCustomers(){
  const f = state.filters;
  let list = state.customers.filter(c =>
    matchesSearch(c, state.search) &&
    (!f.country || c.country === f.country) &&
    (!f.status  || c.status  === f.status) &&
    (!f.grade   || c.grade   === f.grade) &&
    (!f.source  || c.source  === f.source) &&
    passesDue(c, f.due));
  const far = "9999-12-31";
  const cmp = {
    next:    (a,b) => (a.nextFollowUp || far).localeCompare(b.nextFollowUp || far) || a.company.localeCompare(b.company),
    created: (a,b) => (b.createdAt || "").localeCompare(a.createdAt || ""),
    company: (a,b) => a.company.localeCompare(b.company, isZh() ? "zh" : "en"),
    last:    (a,b) => (lastContact(b) || "").localeCompare(lastContact(a) || "")
  }[state.sort];
  return list.sort(cmp);
}
const dueCustomers = () => state.customers
  .filter(c => isOpen(c) && daysBetween(c.nextFollowUp) !== null && daysBetween(c.nextFollowUp) <= 0)
  .sort((a,b) => a.nextFollowUp.localeCompare(b.nextFollowUp));

/* =========================================================================
   6. 视图：看板 / Dashboard
   ========================================================================= */
function renderDashboard(){
  const cs = state.customers;
  const now = Date.now();
  const newMonth = cs.filter(c => now - new Date(c.createdAt).getTime() <= 30*86400000).length;
  const due = dueCustomers();
  const overdue = due.filter(c => daysBetween(c.nextFollowUp) < 0).length;
  const won = cs.filter(c => c.status === "won").length;
  const pipeline = cs.filter(c => isOpen(c)).reduce((s,c) => s + (Number(c.value)||0), 0);

  const stat = (k, v, sub, filter) =>
    `<div class="card click" data-jump='${esc(JSON.stringify(filter||{}))}'>
       <div class="k">${t("s."+k)}</div><div class="v">${v}</div><div class="sub">${t("s."+k+"Sub")}</div>
     </div>`;

  const byStatus = STATUSES.map(s => [s[0], isZh()?s[1]:s[2], cs.filter(c => c.status === s[0]).length])
                           .filter(r => r[2] > 0);
  const byCountry = Object.entries(cs.reduce((m,c) => { if(c.country) m[c.country]=(m[c.country]||0)+1; return m; },{}))
                          .sort((a,b) => b[1]-a[1]).slice(0,8);
  const bySource = Object.entries(cs.reduce((m,c) => { if(c.source) m[c.source]=(m[c.source]||0)+1; return m; },{}))
                         .sort((a,b) => b[1]-a[1]);
  const maxOf = arr => Math.max(1, ...arr.map(r => r[r.length-1]));

  const bars = (rows, max, render) => rows.map(r => `
    <div class="bar-row">
      <div>${render(r)}</div>
      <div class="bar"><i style="width:${Math.round(r[r.length-1]/max*100)}%"></i></div>
      <div class="n">${r[r.length-1]}</div>
    </div>`).join("");

  const recent = cs.flatMap(c => (c.followUps||[]).map(f => ({...f, c})))
                   .sort((a,b) => b.date.localeCompare(a.date)).slice(0,8);

  return `
  <div class="cards">
    ${stat("total", cs.length, null, {})}
    ${stat("newMonth", newMonth, null, {sort:"created"})}
    ${stat("due", due.length, null, {view:"followups"})}
    ${stat("overdue", overdue, null, {view:"followups", due:"overdue"})}
    ${stat("won", won, null, {status:"won"})}
    <div class="card"><div class="k">${t("s.value")}</div>
      <div class="v" style="font-size:20px">${pipeline ? fmtMoney(pipeline,"USD") : "—"}</div>
      <div class="sub">${t("s.valueSub")}</div></div>
  </div>

  <div class="two-col">
    <div>
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-h">${t("p.dueList")} <span class="count">${due.length}</span></div>
      ${due.length ? due.slice(0,10).map(c => {
        const d = dueText(c.nextFollowUp);
        return `<div class="li" data-open="${c.id}">
          <div class="body">
            <div class="t">${flag(c.country)} ${esc(c.company)}</div>
            <div class="d">${esc(c.contact||"")} · <span class="chip ${c.status}">${statusLabel(c.status)}</span></div>
          </div>
          <div class="r"><span class="due ${d.cls}">${d.text}</span><br>${esc(c.nextFollowUp)}</div>
        </div>`;
      }).join("") : `<div class="empty">${t("p.noDue")}</div>`}
    </div>

    <div class="panel">
      <div class="panel-h">${t("p.recent")}</div>
      ${recent.length ? recent.map(f => `
        <div class="li" data-open="${f.c.id}">
          <div class="body">
            <div class="t">${flag(f.c.country)} ${esc(f.c.company)} <span class="tag">${channelLabel(f.channel)}</span></div>
            <div class="d">${esc(f.note || "—")}</div>
          </div>
          <div class="r">${esc(f.date)}</div>
        </div>`).join("") : `<div class="empty">${t("p.noRecent")}</div>`}
    </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:14px">
        <div class="panel-h">${t("p.byStatus")}</div>
        <div class="panel-b">${byStatus.length ? bars(byStatus, maxOf(byStatus),
          r => `<span class="chip ${r[0]}">${esc(r[1])}</span>`) : `<div class="hint">—</div>`}</div>
      </div>
      <div class="panel" style="margin-bottom:14px">
        <div class="panel-h">${t("p.byCountry")}</div>
        <div class="panel-b">${byCountry.length ? bars(byCountry, maxOf(byCountry),
          r => `${flag(r[0])} ${esc(countryName(r[0]))}`) : `<div class="hint">—</div>`}</div>
      </div>
      <div class="panel">
        <div class="panel-h">${t("p.bySource")}</div>
        <div class="panel-b">${bySource.length ? bars(bySource, maxOf(bySource),
          r => esc(sourceLabel(r[0]))) : `<div class="hint">—</div>`}</div>
      </div>
    </div>
  </div>`;
}

function renderCustomers(){
  const list = visibleCustomers();
  const f = state.filters;
  const sel = (name, html) => `<select data-filter="${name}">${html}</select>`;
  const filters = `
  <div class="filters">
    ${sel("country", `<option value="">${t("f.country")} · ${t("f.all")}</option>` +
      COUNTRIES.filter(c => state.customers.some(x => x.country === c[0]))
        .map(c => `<option value="${c[0]}"${f.country===c[0]?" selected":""}>${flag(c[0])} ${esc(isZh()?c[1]:c[2])}</option>`).join(""))}
    ${sel("status", `<option value="">${t("f.status")} · ${t("f.all")}</option>` + optionsHtml(STATUSES, f.status))}

const CSV_COLS = ["company","contact","jobTitle","email","phone","whatsapp","wechat","country",
  "address","source","products","value","currency","grade","status","tags","remark",
  "nextFollowUp","createdAt"];
// 导入时可识别的中文表头 / Chinese headers accepted on import
const CSV_ALIASES = {
  "公司":"company","公司名称":"company","客户名称":"company","company name":"company",
  "联系人":"contact","contact person":"contact","职位":"jobTitle","title":"jobTitle",
  "邮箱":"email","电子邮件":"email","e-mail":"email","电话":"phone","手机":"phone",
  "微信":"wechat","国家":"country","国家/地区":"country","地址":"address",
  "来源":"source","意向产品":"products","产品":"products","金额":"value","意向金额":"value",
  "币种":"currency","等级":"grade","阶段":"status","状态":"status","标签":"tags",
  "备注":"remark","下次跟进":"nextFollowUp","建档":"createdAt","创建时间":"createdAt"
};

function csvCell(v){
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportCsv(){
  const header = CSV_COLS.concat(["country_name","status_label","source_label","lastContact","followUpCount"]);
  const lines = [header.join(",")];
  for(const c of state.customers){
    const row = CSV_COLS.map(k => k === "tags" ? (c.tags||[]).join("; ") : c[k]);
    row.push(countryName(c.country), statusLabel(c.status), sourceLabel(c.source),
             lastContact(c), (c.followUps||[]).length);
    lines.push(row.map(csvCell).join(","));
  }
  download(`customers-${todayStr()}.csv`, "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
  toast(t("set.exported"));
}
function exportJson(){
  download(`ftcrm-backup-${todayStr()}.json`,
    JSON.stringify({version:1, exportedAt:new Date().toISOString(), customers:state.customers}, null, 2),
    "application/json");
  toast(t("set.exported"));
}
function parseCsv(text){
  const rows = [];
  let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    }else if(ch === '"') q = true;
    else if(ch === ","){ row.push(cell); cell = ""; }
    else if(ch === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(ch !== "\r") cell += ch;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}
function codeFromLabel(list, val){
  if(!val) return "";
  const v = String(val).trim().toLowerCase();
  const hit = list.find(r => r[0].toLowerCase() === v || r[1].toLowerCase() === v || r[2].toLowerCase() === v);
  return hit ? hit[0] : "";
}
function countryFromValue(val){
  if(!val) return "";
  const v = String(val).trim().toLowerCase();
  const hit = COUNTRIES.find(c => c[0].toLowerCase() === v || c[1].toLowerCase() === v || c[2].toLowerCase() === v);
  return hit ? hit[0] : "OT";
}
function importFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result || "");
    let incoming = [];
    try{
      if(/\.json$/i.test(file.name) || text.trim().startsWith("{") || text.trim().startsWith("[")){
        const data = JSON.parse(text);
        incoming = Array.isArray(data) ? data : (data.customers || []);
      }else{
        const rows = parseCsv(text);
        if(rows.length < 2) throw new Error("empty csv");
        const head = rows[0].map(h => {
          const k = h.trim();
          if(CSV_COLS.includes(k)) return k;
          const low = k.toLowerCase();
          return CSV_ALIASES[low] || CSV_ALIASES[k] || low;
        });
        incoming = rows.slice(1).map(r => {
          const o = {};
          head.forEach((k, i) => { o[k] = (r[i] || "").trim(); });
          o.country = countryFromValue(o.country);
          o.status  = codeFromLabel(STATUSES, o.status) || "lead";
          o.source  = codeFromLabel(SOURCES, o.source);
          o.grade   = (o.grade || "B").toUpperCase();
          o.tags    = String(o.tags || "").split(/[;,，；]/).map(s => s.trim()).filter(Boolean);
          return o;
        });
      }
    }catch(e){ toast(t("set.importFail")); return; }
    if(!incoming.length){ toast(t("set.importFail")); return; }

    const byKey = new Map(state.customers.map(c => [(c.company + "|" + c.email).toLowerCase(), c]));
    let added = 0;
    for(const raw of incoming){
      const c = normalizeCustomer(raw);
      if(!c.company) continue;
      const key = (c.company + "|" + c.email).toLowerCase();
      const existing = byKey.get(key);
      if(existing){                       // 同名同邮箱 → 合并跟进记录
        const ids = new Set(existing.followUps.map(f => f.id));
        existing.followUps = existing.followUps
          .concat(c.followUps.filter(f => !ids.has(f.id)))
          .sort((a,b) => b.date.localeCompare(a.date));
        if(c.nextFollowUp) existing.nextFollowUp = c.nextFollowUp;
      }else{
        c.id = uid();
        state.customers.push(c);
        byKey.set(key, c);
        added++;
      }
    }
    save(); render();
    toast(t("set.imported", { n: added }));
  };
  reader.readAsText(file, "utf-8");
}

    ["Tokyo Kogyo Co.","佐藤 健","購買部","sato@tokyo-kogyo.jp","JP","referral","Precision CNC parts",65000,"A","negotiating",1,["高要求","品质优先"],
      [[-2,"email","客户提出图纸公差需 ±0.02mm，已转技术部评估。"]]],
    ["Cape Town Supplies","Thabo Nkosi","Buyer","thabo@ctsupplies.co.za","ZA","exhibition","Power tools",11000,"B","dormant","",[],
      [[-120,"email","展会后跟进两次无回复，暂列沉睡客户。"]]]
  ];
  return raw.map(r => normalizeCustomer({
    company:r[0], contact:r[1], jobTitle:r[2], email:r[3], country:r[4], source:r[5],
    products:r[6], value:r[7], currency:"USD", grade:r[8], status:r[9],
    nextFollowUp: r[10] === "" ? "" : off(r[10]),
    tags:r[11],
    createdAt: new Date(Date.now() - (60 + Math.random()*120) * 86400000).toISOString(),
    followUps: r[12].map(f => ({ id: uid(), date: off(f[0]), channel: f[1], note: f[2] }))
  }));
}

/* =========================================================================
   13. 渲染与事件 / Render & events
   ========================================================================= */
function applyTheme(){
  const mode = state.settings.theme;
  const dark = mode === "dark" ||
    (mode === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
function applyStaticI18n(){
  document.documentElement.lang = isZh() ? "zh" : "en";
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("#globalSearch").placeholder = t("search");
  $("#viewTitle").textContent = t("t." + state.view);
  const badge = $("#navBadge");
  const n = dueCustomers().length;
  badge.textContent = n;
  badge.hidden = n === 0;
  $$(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.view === state.view));
}
function renderClock(){
  const el = $("#clock");
  if(!el) return;
  const fmt = new Intl.DateTimeFormat(isZh() ? "zh-CN" : "en-GB",
    { dateStyle:"medium", timeStyle:"short" }).format(new Date());
  el.textContent = (isZh() ? "本地 " : "Local ") + fmt;
}
function render(){
  applyTheme();
  applyStaticI18n();
  renderClock();
  const html = { dashboard:renderDashboard, customers:renderCustomers,
                 followups:renderFollowups, settings:renderSettings }[state.view]();
  $("#content").innerHTML = html;
  if(state.openId) renderDrawer();
}
function go(view){
  state.view = view;
  closeDrawer();
  render();
  window.scrollTo(0, 0);
}
function newCustomer(){
  const c = normalizeCustomer({ nextFollowUp: todayStr() });
  state.customers.unshift(c);
  save();
  render();
  openCustomer(c.id);
}
function saveOpen(){
  const c = currentCustomer();
  if(!c) return;
  if(!readForm(c)) return;
  save(); render(); toast(t("d.saved"));
}

/* ---- 事件绑定 / Event wiring ---- */
$$(".nav-item").forEach(btn => btn.addEventListener("click", () => go(btn.dataset.view)));

$("#addBtn").addEventListener("click", newCustomer);
$("#scrim").addEventListener("click", () => { closeDrawer(); render(); });

$("#langBtn").addEventListener("click", () => {
  state.settings.lang = isZh() ? "en" : "zh";
  save(); render();
});
$("#themeBtn").addEventListener("click", () => {
  const order = ["auto","light","dark"];
  state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % 3];
  save(); render();
  toast(t("set.theme") + ": " + t("set.theme" + state.settings.theme[0].toUpperCase() + state.settings.theme.slice(1)));
});

let searchTimer;
$("#globalSearch").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => {
    state.search = v;
    if(v && state.view !== "customers") state.view = "customers";
    render();
    $("#globalSearch").value = v;
  }, 180);
});

// 主内容区事件委托 / Delegated events in the content area
$("#content").addEventListener("click", e => {
  const openEl = e.target.closest("[data-open]");
  if(openEl){ openCustomer(openEl.dataset.open); return; }

  const jumpEl = e.target.closest("[data-jump]");
  if(jumpEl){
    let cfg = {};
    try{ cfg = JSON.parse(jumpEl.dataset.jump); }catch(err){}
    state.filters = { country:"", status:"", grade:"", source:"", due:"" };
    if(cfg.status) state.filters.status = cfg.status;
    if(cfg.due) state.filters.due = cfg.due;
    if(cfg.sort) state.sort = cfg.sort;
    go(cfg.view || "customers");
    return;
  }

  const id = e.target.id;
  if(id === "resetFilters"){
    state.filters = { country:"", status:"", grade:"", source:"", due:"" };
    state.search = ""; $("#globalSearch").value = ""; render();
  }
  else if(id === "exportJson") exportJson();
  else if(id === "exportCsv")  exportCsv();
  else if(id === "importBtn")  $("#fileInput").click();
  else if(id === "demoBtn"){
    state.customers = demoData().concat(state.customers);
    save(); go("dashboard"); toast(t("set.demoLoaded"));
  }
  else if(id === "clearBtn"){
    if(confirm(t("set.clearConfirm"))){
      state.customers = []; save(); render(); toast(t("set.cleared"));
    }
  }
});
$("#content").addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.filter){ state.filters[el.dataset.filter] = el.value; render(); }
  else if(el.id === "sortSel"){ state.sort = el.value; render(); }
  else if(el.id === "langSel"){ state.settings.lang = el.value; save(); render(); }
  else if(el.id === "themeSel"){ state.settings.theme = el.value; save(); render(); }
});
$("#fileInput").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if(f) importFile(f);
  e.target.value = "";
});

// 抽屉事件委托 / Delegated events inside the drawer
$("#drawer").addEventListener("click", e => {
  const c = currentCustomer();
  if(!c) return;
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){
    captureForm(c);
    state.drawerTab = tabBtn.dataset.tab;
    save(); renderDrawer(); return;
  }
  const delFollow = e.target.closest("[data-del-follow]");
  if(delFollow){
    if(confirm(t("d.delFollow"))){
      c.followUps = c.followUps.filter(f => f.id !== delFollow.dataset.delFollow);
      save(); renderDrawer(); render();
    }
    return;
  }
  switch(e.target.id){
    case "closeDrawer": captureForm(c); save(); closeDrawer(); render(); break;
    case "saveCustomer": saveOpen(); break;
    case "markWon":
      captureForm(c); c.status = "won"; c.updatedAt = new Date().toISOString();
      save(); renderDrawer(); render(); toast(t("d.saved")); break;
    case "delCustomer":
      if(confirm(t("d.confirmDel"))){
        state.customers = state.customers.filter(x => x.id !== c.id);
        save(); closeDrawer(); render(); toast(t("d.deleted"));
      }
      break;
    case "copyMail":
      if(navigator.clipboard) navigator.clipboard.writeText(c.email).then(() => toast(t("d.copied")));
      break;
    case "addFollow": {
      const note = $("#nf_note").value.trim();
      const date = $("#nf_date").value || todayStr();
      if(!note){ $("#nf_note").focus(); return; }
      c.followUps.unshift({ id: uid(), date, channel: $("#nf_channel").value, note });
      c.followUps.sort((a,b) => b.date.localeCompare(a.date));
      const next = $("#nf_next").value;
      c.nextFollowUp = next;
      c.updatedAt = new Date().toISOString();
      save(); renderDrawer(); render(); toast(t("d.saved"));
      break;
    }
  }
});
$("#drawer").addEventListener("change", e => {
  if(e.target.id === "f_country"){
    const hint = e.target.parentElement.querySelector(".hint");
    const txt = localTime(e.target.value);
    if(hint) hint.textContent = txt ? t("c.localTime") + ": " + txt : "";
  }
});

// 键盘快捷键 / Keyboard shortcuts
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key === "Escape" && state.openId){
    const c = currentCustomer(); if(c) captureForm(c);
    save(); closeDrawer(); render();
  }
  else if(e.key === "/" && !typing){ e.preventDefault(); $("#globalSearch").focus(); }
  else if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s"){
    if(state.openId){ e.preventDefault(); saveOpen(); }
  }
  else if(e.key.toLowerCase() === "n" && !typing && !state.openId){ e.preventDefault(); newCustomer(); }
});

// 表单静默回写（切换标签 / 关闭抽屉时不丢失编辑）
function captureForm(c){
  if(state.drawerTab !== "info" || !$("#f_company")) return;
  if(!$("#f_company").value.trim()) return;
  readForm(c);
}

/* =========================================================================
   14. 启动 / Init
   ========================================================================= */
load();
// 首次打开默认中文，右下角「中 / EN」一键切换并记忆
// Defaults to Chinese on first run; the 中/EN button switches and remembers.
if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener.bind(mq,"change") : mq.addListener.bind(mq))(() => {
    if(state.settings.theme === "auto") applyTheme();
  });
}
render();
setInterval(renderClock, 30000);
</script>
</body>
</html>
