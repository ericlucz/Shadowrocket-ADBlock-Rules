name: Build CRM exe

on:
  push:
    branches: [master]
    paths:
      - "crm-desktop/**"
      - ".github/workflows/build-crm-exe.yml"
  pull_request:
    paths:
      - "crm-desktop/**"
      - ".github/workflows/build-crm-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crm-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name CRM main.py
      - uses: actions/upload-artifact@v4
        with:
          name: CRM-windows
          path: crm-desktop/dist/CRM.exe
